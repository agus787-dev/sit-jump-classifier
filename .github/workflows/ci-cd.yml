name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows running it manually from the GitHub "Actions" tab

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Run the API tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest httpx
      - name: Debug - show repo files
        run: |
          pwd
          ls -la
          ls -la tests || echo "tests/ folder not found"
          pytest --collect-only -q || true
      - name: Run tests
        run: pytest -q

  # 2) Make sure the Docker image builds (the same Dockerfile Hugging Face will use)
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sit-jump-api .

  # 3) Deploy to Hugging Face Spaces (only for pushes to main)
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deploy requirements
        run: |
          test -f models/best_video_model.pth   || { echo "models/best_video_model.pth is missing in git"; exit 1; }
          test -f models/class_names.json       || { echo "models/class_names.json is missing in git"; exit 1; }
          grep -q "sdk: docker" README.md       || { echo "README.md has no Hugging Face YAML header (sdk: docker)"; exit 1; }

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" HEAD:main

      # Optional: runs only if the repository variable HF_SPACE_URL is set,
      # e.g. https://myuser-sit-jump-api.hf.space
      - name: Smoke test (wait until the Space is healthy)
        if: vars.HF_SPACE_URL != ''
        env:
          SPACE_URL: ${{ vars.HF_SPACE_URL }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS "${SPACE_URL}/api/v1/health"; then
              echo; echo "Space is healthy."
              exit 0
            fi
            echo "Attempt ${attempt}/20: not ready yet, waiting 30s..."
            sleep 30
          done
          echo "Space did not become healthy in time. Check the Space build logs."
          exit 1
